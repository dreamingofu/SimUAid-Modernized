name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            artifact: macOS
            path: dist/*.dmg
          - os: windows-latest
            script: build:win
            artifact: Windows
            path: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error("Release tag must be " + expected)'

      # Preserve the install mode used by the existing lockfile.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: SimUaid-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SimUaid-*
          merge-multiple: true
          path: installers

      - name: Create checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download the installer for your computer:
          - **Windows:** `SimUaid-*-windows-x64-setup.exe`
          - **macOS (Intel and Apple Silicon):** `SimUaid-*-mac-universal.dmg`

          These builds are unsigned. Windows may show a SmartScreen warning;
          macOS may require approval in System Settings > Privacy & Security.
          Only approve the app if you trust this release and its source.

          `SHA256SUMS.txt` contains checksums for both installers.
          EOF
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace assets on a published release. Use a new version tag."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SimUaid $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" installers/*.dmg installers/*.exe installers/SHA256SUMS.txt --clobber
