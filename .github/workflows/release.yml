name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned off macos-latest: as of the macos-26-arm64 image it breaks
          # .p12 import / codesign keychain unlock ("SecKeychainUnlock: the
          # user name or passphrase you entered is not correct" from
          # `security set-key-partition-list`, reproduced twice on fresh
          # runners with unchanged secrets). Tracked upstream at
          # https://github.com/actions/runner-images/issues/13884. Move back
          # to macos-latest once that's resolved.
          - os: macos-15
            artifact: macOS
            path: dist/*.dmg
          - os: windows-latest
            artifact: Windows
            path: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error("Release tag must be " + expected)'

      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret: $name. See RELEASING.md."
              exit 1
            fi
          done

      # Preserve the install mode used by the existing lockfile.
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build and sign macOS installer
        if: runner.os == 'macOS'
        run: npm run build:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Notarize and verify macOS installer
        if: runner.os == 'macOS'
        # Apple's queue is normally under a minute but can occasionally run past
        # 30 minutes under load; notarytool's own --wait timeout below is the
        # actual budget, so keep this step timeout comfortably above it rather
        # than racing it.
        timeout-minutes: 65
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="dist/mac-universal/SimUaid.app"
          dmg="dist/SimUaid-$(node -p 'require("./package.json").version')-mac-universal.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          # notarytool prints the machine-readable result to stdout and progress/
          # error messages (including the message it prints if --wait times out)
          # to stderr; capture both so a timeout still leaves a submission ID to
          # look up with `notarytool info`/`log` instead of an empty result file.
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 60m --output-format json \
            > notarization-result.json 2> notarization-log.txt
          node -e 'const result = require("./notarization-result.json"); if (result.status !== "Accepted") throw new Error("Apple notarization " + result.status + "; submission " + result.id)'
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Save notarization result
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-notarization-result
          path: |
            notarization-result.json
            notarization-log.txt
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: SimUaid-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SimUaid-*
          merge-multiple: true
          path: installers

      - name: Create checksums
        working-directory: installers
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Download the installer for your computer:
          - **Windows:** `SimUaid-*-windows-x64-setup.exe`
          - **macOS (Intel and Apple Silicon):** `SimUaid-*-mac-universal.dmg`

          The macOS installer is Developer ID signed and notarized by Apple.
          Windows is unsigned and may show a SmartScreen warning.
          Only approve the app if you trust this release and its source.

          `SHA256SUMS.txt` contains checksums for both installers.
          EOF
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
              echo "Refusing to replace assets on a published release. Use a new version tag."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SimUaid $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" installers/*.dmg installers/*.exe installers/SHA256SUMS.txt --clobber
