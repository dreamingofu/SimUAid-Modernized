appId: com.simuaid.app
productName: SimUaid
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
# GitHub Actions uploads installers after both platform builds succeed.
publish: null

mac:
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.education
  # No Apple Developer ID yet. Once you have one:
  #   1. Delete the `identity: null` line below (electron-builder will then
  #      auto-detect your "Developer ID Application" cert from the keychain,
  #      or from CSC_LINK/CSC_KEY_PASSWORD env vars in CI).
  #   2. Uncomment hardenedRuntime + entitlements below.
  #   3. Configure signing and notarization credentials in the build job.
  identity: null
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
