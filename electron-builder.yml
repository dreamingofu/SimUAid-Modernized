appId: com.simuaid.app
productName: SimUaid
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
# GitHub Actions uploads installers after both platform builds succeed.
publish: null

mac:
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'
  # electron-builder removes Electron's root notices while assembling a .app.
  # Keep the runtime licenses in Contents/Resources with the distributed app.
  extraResources:
    - from: node_modules/electron/dist/LICENSE
      to: LICENSE.electron.txt
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.education
  type: distribution
  forceCodeSigning: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # CI notarizes the complete signed DMG, then staples and verifies its ticket.
  notarize: false

dmg:
  sign: true

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  artifactName: '${productName}-${version}-windows-${arch}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
